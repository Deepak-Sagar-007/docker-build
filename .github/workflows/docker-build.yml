name: Docker Build Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  docker-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t github-actions-demo:latest .

      - name: List Docker images
        run: docker images
